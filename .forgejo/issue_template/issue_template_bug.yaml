name: Bug Report
about: File a bug report
title: '[Bug]: '
ref: 'main'
labels:
  - bug
  - 'help needed'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for completing this bug report. I'm always keen to hear about any issues you experience using SailPipe so that they can be fixed.
  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: Please describe the issue in as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps needed to reproduce the bug
      description: Please give the steps needed to reproduce the issue.
    validations:
      required: true
      placeholder: |
        1. Step 1
        2. Step 2
        3. Step 3
  - type: textarea
    id: intended-outcome
    attributes:
      label: Intended outcome
      description: What was the outcome you expected from following these steps?
    validations:
      required: true
  - type: textarea
    id: actual-outcome
    attributes:
      label: Actual outcome
      description: What was the actual outcome that you experienced, which you consider to be a bug.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Please provide details of which version of Sailfish OS you're using, which version of SailPipe and any other relevant aspects of your device configuration that may be relevant to the issue.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste or attach any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
