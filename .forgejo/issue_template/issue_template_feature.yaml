name: Feature Request
about: Request a feature to be added
title: '[Feature]: '
ref: 'main'
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        The app is currently in alpha and I'm therefore focusing more on bugs and stability rather than new features. Given this, in order to not got overwhelmed it's likely that I'll close any feature request that isn't in my immediate plans. Please don't take this personally. I love hearing ideas, but having large numbers of open requests can be disheartening.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Please provide a [user story](https://www.atlassian.com/agile/project-management/user-stories) for the new feature.
      placeholder: "As a [persona], I [want to], [so that]."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: Please describe the feature you'd like added in more detail.
    validations:
      required: true
