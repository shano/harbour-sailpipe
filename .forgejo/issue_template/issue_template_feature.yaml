name: Feature Request
about: Request a feature to be added
title: '[Feature]: '
ref: 'main'
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Many thanks for requesting a feature. I'm always interested to hear ideas about how the app could be improved. However, please bear in mind that the app is currently in alpha and therefore my focus is on bugs and stability rather than new features. As such, please don't have too high expectations about new features being implemented immediately.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Please provide a [user story](https://www.atlassian.com/agile/project-management/user-stories) for the new feature.
      placeholder: "As a [persona], I [want to], [so that]."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: Please describe the feature you'd like added in more detail.
    validations:
      required: true
