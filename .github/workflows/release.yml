name: Build and release Sailfish RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Must match (or be compatible with) the Sailfish OS version on target
  # devices. Check on-device under Settings > About product. Update this
  # when bumping to a newer Sailfish release.
  SFOS_RELEASE: "5.1.0.11"

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["aarch64", "armv7hl"]
    steps:
      - uses: actions/checkout@v4

      - name: Set RPM version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:    ${TAG_VERSION}/" sfos/harbour-sailreel/rpm/harbour-sailreel.spec

      - name: Build RPM via Sailfish Platform SDK
        id: build
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ env.SFOS_RELEASE }}
          source-dir: "sfos/harbour-sailreel"
          fix-version: false

      - uses: actions/upload-artifact@v4
        with:
          name: harbour-sailreel-rpm-${{ matrix.arch }}
          path: RPMS

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RPMS/**/*.rpm
